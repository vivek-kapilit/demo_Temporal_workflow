server {
    listen 80;

    # React -> FastAPI. "api" is the docker-compose service name.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Single-page app: unknown paths (e.g. /payments/<id>) serve index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
